name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_NAME: lrv
      DB_USER: lrv
      DB_PASS: ${{ secrets.GITHUB_TOKEN }}
      COMPOSER_MEMORY_LIMIT: -1
      ANSIBLE_REMOTE_TMP: /tmp
      ANSIBLE_ALLOW_WORLD_READABLE_TMPFILES: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update apt
        run: sudo apt update

      - name: Install PHP and extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php php-cli php-xml php-mbstring php-zip php-curl php-intl php-mysql unzip git

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"
          composer --version

      - name: Install ufw
        run: sudo apt install ufw -y

      - name: Setup Ansible
        run: python3 -m pip install --user ansible

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install community.mysql community.general

      - name: Set masked outputs
        run: |
          echo "::add-mask::$DB_HOST"
          echo "::add-mask::$DB_NAME"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASS"

      - name: Run Ansible playbook
        run: |
          cat << EOF > hosts
          [server]
          localhost

          [db]
          localhost
          EOF

          ansible-playbook \
            -i ./hosts \
            main.yml \
            -e "db_host=$DB_HOST db_name=$DB_NAME db_user=$DB_USER db_pass=$DB_PASS" \
            -c local
            - name: Debug - Check .env file
        run: sudo cat /var/www/app/.env || echo "No .env file found"
        if: always()

      - name: Debug - Check Laravel logs
        run: sudo tail -100 /var/www/app/storage/logs/laravel.log || echo "No logs found"
        if: always()

      - name: Debug - Check PHP version
        run: php -v

      - name: Debug - Check Node/npm versions
        run: |
          node -v
          npm -v

      - name: Debug - List app directory
        run: sudo ls -la /var/www/app/ || echo "Directory not found"

      - name: Debug - Check database
        run: |
          sudo apt-get install mariadb-client -y
          mysql -h "$DB_HOST" \
            -u "$DB_USER" \
            -D "$DB_NAME" \
            -p"$DB_PASS" \
            -e 'SHOW TABLES;' || echo "Database check failed"
        if: always()

      - name: Test application
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./.github/tests

      - name: Test if application uses MariaDB
        run: |
          sudo apt-get install mariadb-client -y
          mysql -h "$DB_HOST" \
            -u "$DB_USER" \
            -D "$DB_NAME" \
            -p"$DB_PASS" \
            -e 'SHOW TABLES;' | grep users
